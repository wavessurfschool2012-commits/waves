<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waves | The Story Begins</title>
    <style>
        /* DISABLE ALL INTERACTION & SCROLLING */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
            pointer-events: none; /* Block all clicks/touches */
            user-select: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* UPPER HALF (50%): The Images welcome1 to welcome9 */
        #upper-deck {
            flex: 1;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #intro-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* LOWER HALF (50%): The Welcome Message */
        #lower-deck {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #ddd;
        }

        #typewriter-text {
            font-family: 'Georgia', serif;
            font-size: 1.25rem;
            line-height: 1.6;
            color: #1a1a1a;
            max-width: 800px;
        }

        .cursor {
            border-right: 3px solid #0077be;
            margin-left: 5px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <div id="upper-deck">
            <img id="intro-image" src="welcome1.jpg" alt="Waves Montage">
        </div>

        <div id="lower-deck">
            <div>
                <span id="typewriter-text"></span><span class="cursor"></span>
            </div>
        </div>
    </div>

    <script>
        // IMAGE CONFIGURATION
        const welcomeImages = [
            "welcome1.jpg", "welcome2.jpg", "welcome3.jpg", 
            "welcome4.jpg", "welcome5.jpg", "welcome6.jpg", 
            "welcome7.jpg", "welcome8.jpg", "welcome9.jpg"
        ];

        const welcomeMsg = "Welcome to Waves. Whether you're here to conquer the Arabian Sea or just to enjoy the best sunset in Mangalore with a coffee, you're exactly where you need to be. After 7 years on the sand, we’ve mastered the art of the perfect wave and the perfect meal.";

        let imgIndex = 0;
        let charIndex = 0;

        const imgElement = document.getElementById('intro-image');
        const textElement = document.getElementById('typewriter-text');

        // 1. IMAGE LOGIC: 9 images in 10 seconds (~1.1s per image)
        function playImages() {
            if (imgIndex < welcomeImages.length) {
                imgElement.src = welcomeImages[imgIndex];
                imgIndex++;
                setTimeout(playImages, 1111); // 10,000ms divided by 9 images
            }
        }

        // 2. TEXT LOGIC: Typing speed calculated to finish around 9 seconds
        function playText() {
            if (charIndex < welcomeMsg.length) {
                textElement.innerHTML += welcomeMsg.charAt(charIndex);
                charIndex++;
                setTimeout(playText, 32); // Calibrated speed for 10s window
            } else {
                // End of 10-second phase
                setTimeout(() => {
                    console.log("Phase 1 Complete. Ready for Image 1 Presentation...");
                    // We will add the transition to your 7-year presentation here
                }, 1000);
            }
        }

        // Start both simultaneously
        window.onload = () => {
            playImages();
            playText();
        };
    </script>
</body>
</html>
