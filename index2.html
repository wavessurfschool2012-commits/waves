<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waves | Welcome</title>
    <style>
        /* 1. SETUP FULL-SCREEN BACKGROUND (SHARP IMAGE) */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            
            /* The base, sharp version of your collage */
            background-image: url('index2.1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            /* DISABLE ALL INTERACTION */
            pointer-events: none;
            user-select: none;
        }

        .container {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 2. THE HAZY WINDOW (Blurred overlay) */
        #hazy-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: inherit; /* Inherits sharp background image */
            background-size: inherit;
            background-position: inherit;
            
            /* The 50% Blur Effect */
            filter: blur(8px) brightness(0.9); /* Adjust 8px to change softness */
            
            /* Prepare the masking logic (leaves only the text sharp) */
            -webkit-mask-image: linear-gradient(black, black); /* Initial solid mask */
            mask-image: linear-gradient(black, black);
            
            /* Transition for smooth animation of letters appearing */
            transition: -webkit-mask-image 0.1s ease-out;
        }

        /* 3. THE BRANDED BOX (For layout, sits outside the hazy window) */
        #text-layout-box {
            position: relative;
            z-index: 10;
            width: 85%;
            min-height: 20vh;
            margin-top: -5%; 
            
            /* Branded Blue Border */
            border: 4px solid #0077be; 
            border-radius: 15px;
            
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        /* 4. TYPEWRITER CONTENT (Will define the alpha mask) */
        #typewriter-text {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #1a1a1a;
            text-align: center;
            font-weight: 500;
            
            /* Initial visibility—will be controlled by JS */
            opacity: 1; 
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #0077be;
            margin-left: 5px;
            vertical-align: middle;
            animation: blink 0.7s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <div id="hazy-overlay"></div>

        <div id="text-layout-box">
            <div>
                <span id="typewriter-text"></span><span class="cursor"></span>
            </div>
        </div>
    </div>

    <script>
        const welcomeMsg = "Welcome to Waves. Whether you're here to conquer the Arabian Sea or just to enjoy the best sunset in Mangalore with a coffee, you're exactly where you need to be. After 7 years on the sand, we’ve mastered the art of the perfect wave and the perfect meal.";

        const textElement = document.getElementById('typewriter-text');
        const overlayElement = document.getElementById('hazy-overlay');
        
        let charIndex = 0;
        const totalDuration = 10000; // 10 seconds
        const typingSpeed = totalDuration / welcomeMsg.length; 

        function playWelcome() {
            if (charIndex < welcomeMsg.length) {
                // Add the letter
                const currentChar = welcomeMsg.charAt(charIndex);
                textElement.innerHTML += currentChar;

                // UPDATE THE MASK: Dynamic CSS linear gradient 
                // As letters add, the 'white' part of the gradient expands
                const visiblePercentage = (charIndex / welcomeMsg.length) * 100;
                overlayElement.style.webkitMaskImage = `linear-gradient(white ${visiblePercentage}%, transparent ${visiblePercentage + 2}%)`;
                overlayElement.style.maskImage = `linear-gradient(white ${visiblePercentage}%, transparent ${visiblePercentage + 2}%)`;

                charIndex++;
                setTimeout(playWelcome, typingSpeed);
            } else {
                console.log("Welcome complete. Transitioning to legacy presentation...");
                // Phase 2 transition logic will go here
            }
        }

        window.onload = playWelcome;
    </script>
</body>
</html>
