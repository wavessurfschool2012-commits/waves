<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waves | Welcome</title>
    <style>
        /* 1. SETUP FULL-SCREEN BACKGROUND */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            
            background-image: url('index2.1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            /* DISABLE ALL INTERACTION */
            pointer-events: none;
            user-select: none;
        }

        .container {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 2. THE BLUR AREA (NO BORDERS) */
        #blur-overlay {
            width: 85%;
            /* Positioned over your surfboard collage area */
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            
            /* LIVE BLUR EFFECT */
            /* This blurs the photo behind the text by 50% */
            backdrop-filter: blur(8px) brightness(0.9);
            -webkit-backdrop-filter: blur(8px) brightness(0.9);
            
            /* Make the blur area invisible until text starts typing */
            background-color: rgba(255, 255, 255, 0.05); 
            border-radius: 20px;
            
            /* Smoothly appear as typing starts */
            opacity: 0;
            transition: opacity 1s ease;
        }

        /* 3. TYPEWRITER TEXT */
        #typewriter-text {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #ffffff; /* White text looks best over a blurred photo */
            font-weight: 600;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #ffffff;
            margin-left: 5px;
            vertical-align: middle;
            animation: blink 0.7s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <div id="blur-overlay">
            <div>
                <span id="typewriter-text"></span><span class="cursor"></span>
            </div>
        </div>
    </div>

    <script>
        const welcomeMsg = "Welcome to Waves. Whether you're here to conquer the Arabian Sea or just to enjoy the best sunset in Mangalore with a coffee, you're exactly where you need to be. After 7 years on the sand, we’ve mastered the art of the perfect wave and the perfect meal.";

        const textElement = document.getElementById('typewriter-text');
        const overlayElement = document.getElementById('blur-overlay');
        
        let charIndex = 0;
        const totalDuration = 10000; // 10 Seconds
        const typingSpeed = totalDuration / welcomeMsg.length;

        function playWelcome() {
            // Show the blur overlay as soon as typing begins
            if (charIndex === 0) {
                overlayElement.style.opacity = "1";
            }

            if (charIndex < welcomeMsg.length) {
                textElement.innerHTML += welcomeMsg.charAt(charIndex);
                charIndex++;
                setTimeout(playWelcome, typingSpeed);
            } else {
                console.log("Intro complete. Awaiting Phase 2 details.");
            }
        }

        window.onload = playWelcome;
    </script>
</body>
</html>
