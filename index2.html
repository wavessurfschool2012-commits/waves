<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waves | Welcome</title>
    <style>
        /* 1. SETUP FULL-SCREEN BACKGROUND */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            
            /* Background Configuration */
            background-image: url('index2.1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            /* DISABLE ALL INTERACTION */
            pointer-events: none;
            user-select: none;
        }

        .container {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 2. THE TEXT BOX (Over your blue marked area) */
        #text-box {
            width: 85%;
            min-height: 20vh;
            /* Positioned to align with the middle section of your collage */
            margin-top: -5%; 
            
            background-color: rgba(255, 255, 255, 0.85); /* Semi-transparent */
            border: 3px solid #0077be; /* Branded Blue */
            border-radius: 15px;
            
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            
            /* This handles the blur effect for the box content */
            transition: filter 0.2s ease;
        }

        /* 3. TYPEWRITER & BLUR ANIMATION */
        #typewriter-text {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #1a1a1a;
            text-align: center;
            font-weight: 500;
        }

        /* The blur effect triggered when a letter enters */
        .blur-active {
            filter: blur(4px);
            opacity: 0.7;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #0077be;
            margin-left: 5px;
            vertical-align: middle;
            animation: blink 0.7s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <div id="text-box">
            <div>
                <span id="typewriter-text"></span><span class="cursor"></span>
            </div>
        </div>
    </div>

    <script>
        const welcomeMsg = "Welcome to Waves. Whether you're here to conquer the Arabian Sea or just to enjoy the best sunset in Mangalore with a coffee, you're exactly where you need to be. After 7 years on the sand, we’ve mastered the art of the perfect wave and the perfect meal.";

        const textElement = document.getElementById('typewriter-text');
        const boxElement = document.getElementById('text-box');
        
        let charIndex = 0;
        const totalDuration = 10000; // 10 Seconds
        const typingSpeed = totalDuration / welcomeMsg.length;

        function playWelcome() {
            if (charIndex < welcomeMsg.length) {
                // Apply Blur Effect
                boxElement.classList.add('blur-active');
                
                // Add the letter
                textElement.innerHTML += welcomeMsg.charAt(charIndex);
                
                // Remove Blur after a tiny delay to create the "flash" effect
                setTimeout(() => {
                    boxElement.classList.remove('blur-active');
                }, 50);

                charIndex++;
                setTimeout(playWelcome, typingSpeed);
            } else {
                console.log("Welcome complete. Waiting for Phase 2 details...");
                // Next phase logic will be added here
            }
        }

        window.onload = playWelcome;
    </script>
</body>
</html>
